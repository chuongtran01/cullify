[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "image-processor"
version = "0.1.0"
description = "Python image processor for Cullify collection jobs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34,<2",
  "bullmq>=2.25,<3",
  "Pillow>=10.0,<12",
  "numpy>=1.26,<3",
  "open-clip-torch>=2.24,<2.32",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "timm>=1.0,<1.0.27",
  "torch>=2.2,<2.12",
  "torchvision>=0.17,<0.27",
]

[project.scripts]
image-processor = "image_processor.main:main"

[tool.setuptools]
package-dir = { "image_processor" = "src" }
packages = [
  "image_processor",
  "image_processor.db",
  "image_processor.db.models",
  "image_processor.db.repositories",
  "image_processor.mq",
  "image_processor.processor",
  "image_processor.processor.quality",
  "image_processor.processor.similarity",
  "image_processor.storage",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
